[package]
name = "droidgear"
version = "1.4.2"
description = "BYOK Model Configuration for Factory Droid"
authors = ["you"]
edition = "2021"
rust-version = "1.95"
# Two binaries exist (the app plus `export_bindings`); the CLI needs to know
# which one is the app entry point.
default-run = "droidgear"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "droidgear_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
droidgear-core = { path = "crates/droidgear-core" }
tauri = { version = "3.0.0-alpha.6", features = ["protocol-asset"] }
tauri-runtime-wry = "3.0.0-alpha.6"
tauri-plugin-opener = "3.0.0-alpha.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.23"
tauri-plugin-clipboard-manager = "3.0.0-alpha.3"
tauri-plugin-dialog = "3.0.0-alpha.4"
tauri-plugin-fs = "3.0.0-alpha.3"
tauri-plugin-log = "3.0.0-alpha.3"
tauri-plugin-notification = "3.0.0-alpha.3"
tauri-plugin-persisted-scope = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-os = "3.0.0-alpha.3"
tauri-plugin-global-shortcut = "3.0.0-alpha.3"
log = "0.4"
regex = "1"
reqwest = { version = "0.13", features = ["json", "cookies", "query"] }
minisign-verify = "0.3"
dirs = "7"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
chrono = "0.4"
json_comments = "0.2"
tauri-plugin-pty = { path = "vendor/tauri-plugin-pty" }
toml = "1"
semver = "1"
sha2 = "0.11"

# Type-safe Tauri command bindings
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }
tauri-specta = { path = "vendor/tauri-specta", features = ["typescript"] }
specta-typescript = "=0.0.15"
tauri-plugin-system-fonts = { path = "vendor/tauri-plugin-system-fonts" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "3.0.0-alpha.3"
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-window-state = "3.0.0-alpha.2"

[target.'cfg(target_os = "windows")'.dependencies]
self-replace = "1.5"

# Optimize for smaller binary size in release builds
[profile.release]
codegen-units = 1        # Better LLVM optimization (slower build, smaller binary)
lto = true               # Link-time optimizations
opt-level = "s"          # Optimize for size over speed
panic = "abort"          # Don't include panic unwinding code
strip = true             # Remove debug symbols

[workspace]
members = ["crates/droidgear-core", "crates/droidgear-tui"]
resolver = "2"
# Vendored crates are path dependencies only: keep them out of the workspace so
# `cargo test` / `cargo clippy` never lint third-party code with our flags.
exclude = ["vendor"]

# Temporary fork of tauri-plugin-updater 3.0.0-alpha.3.
#
# The published alpha pins `zip = "4"` on Windows, which carries the archive
# extraction advisories RUSTSEC-2026-0367 / 0368 / 0369 / 0429 / 0545 / 0548
# (SUID preservation, symlink escapes, AES auth-code skip, header mismatch).
# Upstream's v3 branch still requires zip 4, so `vendor/tauri-plugin-updater` is
# the crates.io source with two lines changed: `zip = "9"` and the deflate
# feature needed to keep unpacking updater bundles. Remove this patch once a
# published release depends on zip >= 9 (see the vendor README).
[patch.crates-io]
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }
