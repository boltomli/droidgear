[package]
name = "droidgear"
version = "1.3.1"
description = "BYOK Model Configuration for Factory Droid"
authors = ["you"]
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "droidgear_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.0", features = [] }

[dependencies]
droidgear-core = { path = "crates/droidgear-core" }
tauri = { version = "3.0.0-alpha.1", features = ["macos-private-api"] }
tauri-plugin-opener = "3.0.0-alpha.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
tauri-plugin-clipboard-manager = "3.0.0-alpha.0"
tauri-plugin-dialog = "3.0.0-alpha.0"
tauri-plugin-fs = "3.0.0-alpha.0"
tauri-plugin-log = "3.0.0-alpha.0"
tauri-plugin-notification = "3.0.0-alpha.0"
tauri-plugin-persisted-scope = "3.0.0-alpha.0"
tauri-plugin-process = "3.0.0-alpha.0"
tauri-plugin-os = "3.0.0-alpha.0"
tauri-plugin-global-shortcut = "3.0.0-alpha.0"
log = "0.4"
regex = "1"
reqwest = { version = "0.12", features = ["json", "cookies"] }
minisign-verify = "0.2"
dirs = "5"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
chrono = "0.4"
json_comments = "0.2"
tauri-plugin-pty = { path = "../../tauri-plugin-pty" }
toml = "0.8"
semver = "1"
sha2 = "0.10"

# Type-safe Tauri command bindings
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
tauri-specta = { path = "../../tauri-specta", features = ["typescript"] }
specta-typescript = "=0.0.13"
tauri-plugin-system-fonts = { path = "../../tauri-plugin-system-fonts" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "3.0.0-alpha.0"
tauri-plugin-updater = "3.0.0-alpha.0"
tauri-plugin-window-state = "3.0.0-alpha.0"

[target.'cfg(target_os = "windows")'.dependencies]
self-replace = "1.5"

# Optimize for smaller binary size in release builds
[profile.release]
codegen-units = 1        # Better LLVM optimization (slower build, smaller binary)
lto = true               # Link-time optimizations
opt-level = "s"          # Optimize for size over speed
panic = "abort"          # Don't include panic unwinding code
strip = true             # Remove debug symbols

[workspace]
members = ["crates/droidgear-core", "crates/droidgear-tui"]
resolver = "2"

[patch.crates-io]
specta = { git = "https://github.com/specta-rs/specta.git", rev = "2757fa8899926dce7da999780c7edf2dc08a732a" }
specta-macros = { git = "https://github.com/specta-rs/specta.git", rev = "2757fa8899926dce7da999780c7edf2dc08a732a" }
specta-serde = { git = "https://github.com/specta-rs/specta.git", rev = "2757fa8899926dce7da999780c7edf2dc08a732a" }
specta-typescript = { git = "https://github.com/specta-rs/specta.git", rev = "2757fa8899926dce7da999780c7edf2dc08a732a" }
specta-util = { git = "https://github.com/specta-rs/specta.git", rev = "2757fa8899926dce7da999780c7edf2dc08a732a" }
