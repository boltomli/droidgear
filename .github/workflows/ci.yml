name: 'CI'

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check:all
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # tauri-plugin-pty links against the Tauri Linux stack.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Same gate contributors run locally: typecheck, lint, ast-grep,
      # format checks, clippy, and the frontend + Rust test suites.
      - name: Run all checks
        run: npm run check:all

      # RustSec advisories. Warnings (unmaintained / unsound / yanked) are
      # reported but do not fail the build; actual vulnerabilities do.
      - name: Audit Rust dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        # tauri-plugin-updater 3.0.0-alpha.3 pins zip 4.x, which carries the
        # RUSTSEC-2026-0367/0368/0369/0429/0545/0548 extraction advisories.
        # They only bite when extracting an archive that already passed the
        # updater signature check, and the fix needs a plugin release on zip 9.
        # Drop these --ignore flags once the plugin moves.
        run: |
          cd src-tauri
          cargo audit \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369 \
            --ignore RUSTSEC-2026-0429 \
            --ignore RUSTSEC-2026-0545 \
            --ignore RUSTSEC-2026-0548
