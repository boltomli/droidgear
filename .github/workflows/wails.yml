name: wails

# Guards the Wails port against the drift classes found in
# docs/developer/wails-port-guidelines.zh.md (§8.1): command-surface
# divergence, version-source drift and shared registry data drift.
# Also guards docs/developer/wails-round2-layout-and-gaps.zh.md §5.2:
# the Go steps must run AFTER the frontend bundle exists (go:embed
# all:frontend/dist) and the Tailwind output must actually contain the
# layout utilities (the v4 content-detection/Vite-root trap).
# Windows-only on purpose: internal/app uses Windows syscall fields
# (SysProcAttr.HideWindow), so the Go service does not cross-compile.

on:
  pull_request:
    paths:
      - 'wails/**'
      - 'src/**'
      - 'scripts/check-command-surface.mjs'
      - 'scripts/check-go-layering.mjs'
      - 'locales/**'
      - '.github/workflows/wails.yml'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: wails/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependency drift
        run: npm ls --depth=0

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Frontend tests
        run: npm run test:run

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Generate bindings
        working-directory: wails
        run: wails3 generate bindings -clean=true -ts -i

      # Creates frontend/dist for go:embed — must precede the Go steps.
      - name: Build Wails frontend
        run: npx vite build --config wails/vite.config.ts --mode production

      # Cheapest regression sentinel for the Tailwind v4/Vite-root trap
      # (round2 §2): if content detection drifts back to wails/ only, the
      # CSS collapses to ~45 kB and every layout utility disappears.
      - name: Tailwind utilities guard
        shell: bash
        run: |
          css=$(ls wails/frontend/dist/assets/index-*.css)
          grep -qF '.h-screen' "$css" || { echo "missing .h-screen → Tailwind 没扫到 src/"; exit 1; }
          grep -qF 'w-\[280px\]' "$css" || { echo "missing w-[280px] → 侧栏宽度丢失"; exit 1; }
          echo "css=$(basename "$css") size=$(wc -c <"$css") bytes"

      - name: Go static checks and tests
        working-directory: wails
        shell: bash
        run: |
          fmt="$(gofmt -l .)"
          if [ -n "$fmt" ]; then
            echo "gofmt needed on:"; echo "$fmt"; exit 1
          fi
          go vet ./...
          go test ./...

      - name: Command surface drift
        run: node scripts/check-command-surface.mjs

      # docs/developer/wails-tui-cli-design.zh.md §2: internal/service must
      # stay free of Wails, cmd/dg must not import internal/app.
      - name: Go layering gate
        run: node scripts/check-go-layering.mjs

      - name: Version source drift
        run: node wails/scripts/sync-version.mjs --check

      - name: Shared registry data drift
        shell: bash
        run: cmp src/lib/model-registry-data.json wails/internal/core/registrydata/model-registry-data.json

  # The `dg` CLI must build and test with no GUI toolchain: no wails3, no
  # npm, no WebKitGTK/Cocoa. internal/app cannot cross-compile to linux
  # (it pulls in wails/v3's gtk bindings), so a green job here is the
  # executable proof of layering rule R3 — see
  # docs/developer/wails-tui-cli-design.zh.md §4.1/§7.
  cli-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: wails/go.mod

      - name: Build dg (CGO off, no WebKit installed)
        working-directory: wails
        run: CGO_ENABLED=0 go build -o dg ./cmd/dg

      - name: Headless tests (CLI, service, core)
        working-directory: wails
        run: go test ./cmd/... ./internal/service/... ./internal/core/...
